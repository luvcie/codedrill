name: Nix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Nix build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.5
      - run: nix build .#default --no-link --no-write-lock-file -L
